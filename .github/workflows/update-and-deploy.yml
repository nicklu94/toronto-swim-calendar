name: Update swim calendar and deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # GitHub cron uses UTC and may start late. Run once each morning instead
    # of gating on an exact Toronto hour, so delayed starts still update.
    - cron: "15 10 * * *"

permissions:
  contents: write

concurrency:
  group: update-swim-calendar
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh schedule
        run: pnpm run update:schedule

      - name: Build
        run: pnpm run build

      - name: Check for content changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- app/schedule-data.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No schedule-data.ts changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Schedule data changed."
          fi

      - name: Commit refreshed schedule
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "toronto-swim-bot"
          git config user.email "toronto-swim-bot@users.noreply.github.com"
          git add app/schedule-data.ts
          git commit -m "Update swim schedule"
          git push

      - name: Deploy to Cloudflare Workers
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_CUSTOM_DOMAIN: ${{ secrets.CLOUDFLARE_CUSTOM_DOMAIN }}
          CLOUDFLARE_ENABLE_CUSTOM_DOMAIN: ${{ secrets.CLOUDFLARE_ENABLE_CUSTOM_DOMAIN }}
        shell: bash
        run: |
          deploy_args=(deploy --config dist/server/wrangler.json)
          if [ "$CLOUDFLARE_ENABLE_CUSTOM_DOMAIN" = "true" ] && [ -n "$CLOUDFLARE_CUSTOM_DOMAIN" ]; then
            deploy_args+=(--domain "$CLOUDFLARE_CUSTOM_DOMAIN")
          fi
          pnpm exec wrangler "${deploy_args[@]}"
