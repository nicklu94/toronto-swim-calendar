name: Update swim calendar and deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # GitHub cron uses UTC and may start late. Run once each morning instead
    # of gating on an exact Toronto hour, so delayed starts still update.
    - cron: "15 10 * * *"

permissions:
  contents: write

concurrency:
  group: update-swim-calendar
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh schedule
        run: pnpm run update:schedule

      - name: Build
        run: pnpm run build

      - name: Attach production domain and ratings database
        run: |
          node -e "const fs=require('node:fs'); const path='dist/server/wrangler.json'; const config=JSON.parse(fs.readFileSync(path,'utf8')); config.routes=[{pattern:'torontoswim.ca',custom_domain:true}]; config.d1_databases=[{binding:'DB',database_name:'toronto-swim-ratings',database_id:'10ad1542-f841-4f2b-bc00-6a9cf2adeb75'}]; fs.writeFileSync(path, JSON.stringify(config));"

      - name: Check for content changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- app/schedule-data.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No schedule-data.ts changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Schedule data changed."
          fi

      - name: Commit refreshed schedule
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "toronto-swim-bot"
          git config user.email "toronto-swim-bot@users.noreply.github.com"
          git add app/schedule-data.ts
          git commit -m "Update swim schedule"
          git push

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json

      - name: Verify production website and ratings API
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 4 https://torontoswim.ca/ > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 4 "https://torontoswim.ca/api/ratings?venueId=agincourt-community-recreation-centre" > /dev/null
