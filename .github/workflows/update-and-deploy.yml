name: Update swim calendar and deploy

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. These two entries cover 5 AM Toronto time
    # across daylight saving time and standard time. A gate below skips
    # the non-matching run.
    - cron: "15 9 * * *"
    - cron: "15 10 * * *"

permissions:
  contents: write

concurrency:
  group: update-swim-calendar
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Toronto run window
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            toronto_hour="$(TZ=America/Toronto date +%H)"
            if [ "$toronto_hour" != "05" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping: not the 5 AM hour in Toronto."
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Setup pnpm
        if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Refresh schedule
        if: steps.gate.outputs.run == 'true'
        run: pnpm run update:schedule

      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: pnpm run build

      - name: Check for content changes
        if: steps.gate.outputs.run == 'true'
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- app/schedule-data.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No schedule-data.ts changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Schedule data changed."
          fi

      - name: Commit refreshed schedule
        if: steps.gate.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "toronto-swim-bot"
          git config user.email "toronto-swim-bot@users.noreply.github.com"
          git add app/schedule-data.ts
          git commit -m "Update swim schedule"
          git push

      - name: Deploy to Cloudflare Workers
        if: steps.gate.outputs.run == 'true' && (steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_CUSTOM_DOMAIN: ${{ secrets.CLOUDFLARE_CUSTOM_DOMAIN }}
        shell: bash
        run: |
          deploy_args=(deploy --config dist/server/wrangler.json)
          if [ -n "$CLOUDFLARE_CUSTOM_DOMAIN" ]; then
            deploy_args+=(--domain "$CLOUDFLARE_CUSTOM_DOMAIN")
          fi
          pnpm exec wrangler "${deploy_args[@]}"
